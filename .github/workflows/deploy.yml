name: Deploy SkyShield

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: skyshield-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend
        working-directory: SkyShield-Server
        run: mvn clean package -DskipTests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: SkyShield-Client/package-lock.json

      - name: Build frontend
        working-directory: SkyShield-Client
        run: |
          npm ci
          npm run build:prod

      - name: Pack frontend
        run: tar -czf frontend-dist.tar.gz -C SkyShield-Client/dist .

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SKYSHIELD_SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SKYSHIELD_SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/skyshield_deploy_key
          chmod 600 ~/.ssh/skyshield_deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload artifacts
        env:
          SERVER_HOST: ${{ secrets.SKYSHIELD_SERVER_HOST }}
          SERVER_USER: ${{ secrets.SKYSHIELD_SERVER_USER }}
        run: |
          DEPLOY_DIR="/root/skyshield-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "DEPLOY_DIR=$DEPLOY_DIR" >> "$GITHUB_ENV"
          ssh -i ~/.ssh/skyshield_deploy_key "$SERVER_USER@$SERVER_HOST" "mkdir -p '$DEPLOY_DIR' && chmod 700 '$DEPLOY_DIR'"
          scp -i ~/.ssh/skyshield_deploy_key SkyShield-Server/skyshield-admin/target/skyshield-admin.jar "$SERVER_USER@$SERVER_HOST:$DEPLOY_DIR/skyshield-admin.jar"
          scp -i ~/.ssh/skyshield_deploy_key frontend-dist.tar.gz "$SERVER_USER@$SERVER_HOST:$DEPLOY_DIR/frontend-dist.tar.gz"
          scp -i ~/.ssh/skyshield_deploy_key ops/deploy-uploaded.sh "$SERVER_USER@$SERVER_HOST:$DEPLOY_DIR/deploy-uploaded.sh"

      - name: Deploy on server
        env:
          SERVER_HOST: ${{ secrets.SKYSHIELD_SERVER_HOST }}
          SERVER_USER: ${{ secrets.SKYSHIELD_SERVER_USER }}
        run: |
          ssh -i ~/.ssh/skyshield_deploy_key "$SERVER_USER@$SERVER_HOST" "bash '$DEPLOY_DIR/deploy-uploaded.sh' '$DEPLOY_DIR'"

      - name: Verify deployment
        env:
          SERVER_HOST: ${{ secrets.SKYSHIELD_SERVER_HOST }}
        run: |
          curl -fsS --max-time 20 "http://$SERVER_HOST/" >/dev/null
          curl -fsS --max-time 20 "http://$SERVER_HOST/prod-api/captchaImage" >/dev/null
          echo "verify_ok"
