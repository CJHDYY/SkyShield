name: Deploy SkyShield

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: skyshield-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend
        working-directory: SkyShield-Server
        run: mvn clean package -DskipTests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: SkyShield-Client/package-lock.json

      - name: Build frontend
        working-directory: SkyShield-Client
        run: |
          npm ci
          npm run build:prod

      - name: Pack frontend
        run: tar -czf frontend-dist.tar.gz -C SkyShield-Client/dist .

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SKYSHIELD_SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SKYSHIELD_SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/skyshield_deploy_key
          sed -i 's/\r$//' ~/.ssh/skyshield_deploy_key
          chmod 600 ~/.ssh/skyshield_deploy_key
          ssh-keygen -y -f ~/.ssh/skyshield_deploy_key > ~/.ssh/skyshield_deploy_key.pub
          ssh-keygen -lf ~/.ssh/skyshield_deploy_key.pub
          ssh-keyscan -t ed25519,rsa -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload artifacts
        env:
          SERVER_HOST: ${{ secrets.SKYSHIELD_SERVER_HOST }}
          SERVER_USER: ${{ secrets.SKYSHIELD_SERVER_USER }}
        run: |
          DEPLOY_DIR="/root/skyshield-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "DEPLOY_DIR=$DEPLOY_DIR" >> "$GITHUB_ENV"
          REMOTE="${SERVER_USER}@${SERVER_HOST}"
          SSH_OPTS="-o BatchMode=yes -o HostKeyAlgorithms=+ssh-ed25519,+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-ed25519,+ssh-rsa -i $HOME/.ssh/skyshield_deploy_key"
          ssh $SSH_OPTS "$REMOTE" "whoami && hostname && mkdir -p '$DEPLOY_DIR' && chmod 700 '$DEPLOY_DIR'"
          scp $SSH_OPTS SkyShield-Server/skyshield-admin/target/skyshield-admin.jar "${REMOTE}:${DEPLOY_DIR}/skyshield-admin.jar"
          scp $SSH_OPTS frontend-dist.tar.gz "${REMOTE}:${DEPLOY_DIR}/frontend-dist.tar.gz"
          scp $SSH_OPTS ops/deploy-uploaded.sh "${REMOTE}:${DEPLOY_DIR}/deploy-uploaded.sh"

      - name: Deploy on server
        env:
          SERVER_HOST: ${{ secrets.SKYSHIELD_SERVER_HOST }}
          SERVER_USER: ${{ secrets.SKYSHIELD_SERVER_USER }}
        run: |
          ssh -o BatchMode=yes -o HostKeyAlgorithms=+ssh-ed25519,+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-ed25519,+ssh-rsa -i ~/.ssh/skyshield_deploy_key "${SERVER_USER}@${SERVER_HOST}" "bash '$DEPLOY_DIR/deploy-uploaded.sh' '$DEPLOY_DIR'"

      - name: Verify deployment
        env:
          SERVER_HOST: ${{ secrets.SKYSHIELD_SERVER_HOST }}
        run: |
          curl -fsS --max-time 20 "http://$SERVER_HOST/" >/dev/null
          curl -fsS --max-time 20 "http://$SERVER_HOST/prod-api/captchaImage" >/dev/null
          echo "verify_ok"
